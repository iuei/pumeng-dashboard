<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>谱梦 · 进度监控</title>
<style>
:root {
  --bg: #070B14;
  --surface: #0F172A;
  --surface-2: #111C30;
  --border: #1E293B;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --blue: #3B82F6;
  --blue-ink: #BFDBFE;
  --blue-deep: #1E3A5F;
  --red: #EF4444;
  --red-ink: #FEE2E2;
  --red-deep: #7F1D1D;
  --block: #30141C;
  --block-border: #5A1E28;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color-scheme: dark;
}
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
.wrap { max-width: 1848px; margin: 0 auto; padding: 12px 28px 20px; }
.skip {
  position: absolute; left: 12px; top: -48px; background: var(--blue); color: #fff;
  padding: 8px 12px; border-radius: 8px; z-index: 5;
}
.skip:focus { top: 12px; }
.hdr {
  display: flex; justify-content: space-between; gap: 18px 28px; flex-wrap: wrap;
  align-items: flex-start; padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 750; display: flex; gap: 10px; align-items: center; }
.star { color: var(--blue); font-size: 18px; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 16px; max-width: 72rem; }
.stamp { margin: 2px 0 0; color: var(--text); font-size: 16px; }
.hdr-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; max-width: 100%; }
.badge-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 14px; }
.badge {
  border: 2px solid var(--blue); background: var(--blue-deep); color: var(--blue-ink);
  padding: 8px 14px; border-radius: 10px; font-size: 16px; font-weight: 750;
}
.date { color: var(--muted); font-size: 18px; }
.times { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; min-width: 0; justify-items: end; }
.times dt { color: var(--muted); font-size: 16px; }
.times dd { margin: 0; font-size: 16px; min-width: 0; text-align: right; }
.time-help, .fold-extra { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
.time-help summary, .fold-extra summary { cursor: pointer; color: var(--text); font-weight: 700; }
.fixture-banner {
  margin: 0 0 12px; padding: 10px 12px; border-radius: 12px;
  background: var(--block); color: var(--red-ink); border: 1px solid var(--block-border);
}
.sec { margin-top: 10px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 6px; }
.sec-h h2 { margin: 0; font-size: 20px; font-weight: 750; }
.sec-h p { margin: 0; color: var(--muted); font-size: 16px; flex: 1 1 220px; min-width: 0; }
.mark { color: var(--blue); margin-right: 8px; }
.mark.warn { color: var(--red); }
.legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 16px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot.bad { background: var(--red); }
.dot.run { background: #64748B; }
.decisions, .today, .metrics { display: grid; gap: 10px; }
.decisions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.today, .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card {
  position: relative; min-width: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 12px 8px 16px;
}
.card::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px;
  border-radius: 0 3px 3px 0; background: var(--blue);
}
.card.block { background: var(--block); border-color: var(--block-border); }
.card.block::before { width: 8px; background: var(--red); }
.card.metric::before { display: none; }
.card h3 { margin: 0 0 4px; font-size: 18px; line-height: 1.3; }
.note, .blocker-line, .eta, .progress-unknown, .done-line, .block-line { margin: 0 0 4px; color: var(--muted); font-size: 15px; }
.blocker-line, .block-line { color: #FCA5A5; }
.meta, .actions, .bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.pill {
  display: inline-flex; align-items: center; min-height: 28px; padding: 4px 10px;
  border-radius: 7px; font-size: 16px; font-weight: 750;
}
.pill.blue { background: var(--blue-deep); color: var(--blue-ink); }
.pill.red { background: var(--red-deep); color: var(--red-ink); }
.pill.muted { color: var(--muted); border: 1px solid var(--border); font-weight: 650; }
.btn {
  border: 0; border-radius: 9px; min-height: 36px; padding: 4px 12px;
  font: inherit; font-size: 16px; font-weight: 750; cursor: pointer;
}
.btn.primary { background: var(--blue); color: #fff; margin-left: auto; }
.btn.danger { background: var(--red-deep); color: var(--red-ink); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid #334155; }
.linkish {
  background: none; border: 0; color: var(--blue); font: inherit; font-weight: 750;
  padding: 0 0 0 8px; cursor: pointer;
}
.bar { flex: 1 1 80px; height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; min-width: 0; }
.bar > span { display: block; height: 100%; background: var(--blue); }
.pct { min-width: 3rem; font-size: 16px; font-weight: 700; }
.local-flag { margin: 10px 0 0; color: var(--blue-ink); font-weight: 750; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 16px 12px; }
.day { display: grid; grid-template-columns: 8.2rem 1.2rem minmax(0, 1fr); gap: 6px; align-items: start; padding: 1px 0; }
.date { color: var(--muted); font-size: 16px; }
.day.today .date { color: var(--text); font-weight: 750; }
.node-col { position: relative; display: flex; justify-content: center; min-height: 18px; }
.node-col::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--border); }
.day:first-child .node-col::before { top: 8px; }
.day:last-child .node-col::before { bottom: auto; height: 14px; }
.node {
  width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--blue);
  background: var(--bg); position: relative; z-index: 1;
}
.node.red { background: var(--red); border-color: var(--red); }
.node.today { width: 16px; height: 16px; background: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.25); }
.today-box { border: 2px solid var(--blue); border-radius: 12px; background: var(--surface-2); padding: 6px 10px 4px; min-width: 0; }
.today-box h3 { margin: 0 0 2px; font-size: 16px; }
.inline-more { display: inline; margin-left: 6px; }
.inline-more summary { display: inline; color: var(--blue); cursor: pointer; }
.compact { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; min-width: 0; }
.compact p { margin: 0; min-width: 0; flex: 1 1 12rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.compact .bad, .bad { color: #FCA5A5; }
.strong { font-weight: 750; }
.corner { float: right; color: var(--muted); font-size: 16px; }
.ml { color: var(--muted); font-size: 16px; clear: both; }
.num { font-size: 28px; font-weight: 750; line-height: 1.1; margin: 2px 0; }
.delta, .series, .meta-line, .empty { color: var(--muted); font-size: 16px; }
.other, .fold-extra { margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; }
.other summary, .fold-extra summary { font-size: 16px; font-weight: 750; }
.other-item, .record { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; min-width: 0; }
.record p { margin: 0 0 4px; }
.foot { margin-top: 18px; color: var(--muted); font-size: 14px; }
.foot p { margin: 0 0 6px; }
.backdrop { position: fixed; inset: 0; background: rgba(2, 6, 16, .72); display: grid; place-items: center; padding: 16px; z-index: 40; }
.dialog { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.dialog h3 { margin: 0 0 8px; font-size: 22px; }
.warn { color: var(--red-ink); font-weight: 750; }
.object-line { color: var(--muted); }
textarea, label { display: block; width: 100%; }
textarea {
  margin-top: 6px; min-height: 96px; padding: 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
}
.err { min-height: 1.2em; color: #FCA5A5; font-weight: 700; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid #F8FAFC; outline-offset: 2px; }
.note, .card h3, .today-box p, .compact p, .other-item, .times dd, .sub { overflow-wrap: anywhere; }
@media (min-width: 1200px) {
  .wrap { padding: 6px 24px 6px; }
  .hdr { padding-bottom: 4px; gap: 6px 16px; }
  h1, .sec-h h2, .card h3, .today-box h3 { line-height: 1.15; }
  h1 { font-size: 43px; }
  .sub, .stamp, .note, .blocker-line, .eta, .progress-unknown, .done-line, .block-line, .sec-h p, .compact p { line-height: 1.25; }
  .sec { margin-top: 4px; }
  .sec-h { margin-bottom: 2px; }
  .sec-h h2 { font-size: 27px; }
  .card { padding: 4px 8px 4px 14px; }
  .card h3, .today-box h3 { font-size: 24px; margin-bottom: 2px; }
  .note, .blocker-line, .eta, .progress-unknown, .done-line, .block-line, .sub, .stamp, .sec-h p, .compact p {
    font-size: 20px;
  }
  .btn { font-size: 20px; min-height: 28px; padding: 1px 10px; }
  .num { font-size: 42px; margin: 0; line-height: 1; }
  .pill, .legend, .delta, .series, .ml, .badge, .date { font-size: 16px; line-height: 1.2; }
  .delta, .series { margin: 0; }
  .day { padding: 0; }
  .panel { padding: 2px 10px 2px; }
  .today-box { padding: 2px 8px 2px; }
}
@media (max-width: 1100px) {
  .today, .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .wrap { padding: 14px 14px 28px; }
  h1 { font-size: 28px; }
  .decisions, .today, .metrics { grid-template-columns: minmax(0, 1fr); }
  .legend { margin-left: 0; }
  .hdr-side, .badge-row { align-items: flex-start; justify-content: flex-start; }
  .times, .times dd { justify-items: start; text-align: left; }
  .btn.primary { margin-left: 0; }
  .card .btn, .dialog .btn { width: 100%; min-height: 44px; }
  .day { grid-template-columns: 1.4rem minmax(0, 1fr); }
  .day .date { grid-column: 1 / -1; }
  .num { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>

<div id="app"><p class="boot">加载中…</p></div>
