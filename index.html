<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>谱梦音乐 · 运营监控台</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg: #0f1419;
    --card: #1a222c;
    --border: #2a3542;
    --text: #e7ecf1;
    --muted: #9aa7b5;
    --accent: #5b9fd4;
    --ok: #3dba7a;
    --warn: #d4a017;
    --danger: #d65a5a;
    --chip: #243040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 20px 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { font-size: 1.55rem; margin: 0 0 6px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 0.92rem; }
  .stamp { color: var(--accent); font-size: 0.85rem; margin-top: 8px; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 20px 48px;
    display: grid;
    gap: 16px;
  }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 18px 14px;
  }
  section h2 {
    margin: 0 0 12px;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 800px) {
    .grid-2, .grid-4 { grid-template-columns: 1fr; }
  }
  .metric {
    background: var(--chip);
    border-radius: 10px;
    padding: 12px;
  }
  .metric .v { font-size: 1.35rem; font-weight: 650; }
  .metric .l { color: var(--muted); font-size: 0.8rem; }
  .cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }
  .col h3 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: none;
  }
  .task {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #141b24;
  }
  .task .t { font-size: 0.92rem; }
  .task .m { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
  .pill {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    margin-right: 6px;
  }
  .pill.ok { color: var(--ok); }
  .pill.warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .bar-row { display: grid; grid-template-columns: 72px 1fr 64px; gap: 8px; align-items: center; font-size: 0.85rem; }
  .bar-track { height: 8px; background: #0c1117; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .bot {
    display: flex; flex-direction: column; gap: 2px;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #141b24;
  }
  .bot .n { font-weight: 600; }
  .bot .r { color: var(--accent); font-size: 0.8rem; }
  .bot .f { color: var(--muted); font-size: 0.8rem; }
  .note { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
  .err { color: var(--danger); }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>
  <header>
    <h1 id="title">谱梦音乐 · 运营监控台</h1>
    <div class="sub">进度与聚合数字 · 每 30 秒自动刷新 · 不含单曲明细/账号/密钥</div>
    <div class="stamp" id="stamp">加载中…</div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
<script>
const REFRESH_MS = 30000;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function taskCard(t) {
  const ready = t.artifact_ready === true ? '<span class="pill ok">稿件已到</span>' :
                t.artifact_ready === false ? '<span class="pill warn">稿件未到</span>' : '';
  const art = t.artifact ? `<span class="pill">${esc(t.artifact)}</span>` : '';
  return `<div class="task">
    <div class="t">${ready}${art}<span class="pill">${esc(t.owner||'')}</span>${esc(t.title||'')}</div>
    ${t.note ? `<div class="m">${esc(t.note)}</div>` : ''}
  </div>`;
}

function col(title, items) {
  return `<div class="col"><h3>${esc(title)} · ${items.length}</h3>${items.map(taskCard).join('') || '<div class="note">（空）</div>'}</div>`;
}

function render(d) {
  document.getElementById('title').textContent = d.title || '谱梦音乐 · 运营监控台';
  document.getElementById('stamp').textContent = '更新时间：' + (d.updated_at || '未知') + ' · 自动刷新 ' + (d.refresh_seconds||30) + 's';

  const rev = d.revenue || {};
  const months = rev.monthly || [];
  const maxBill = Math.max(1, ...months.filter(m => m.bill_yuan != null).map(m => m.bill_yuan));
  const bars = months.map(m => {
    const v = m.bill_yuan;
    const w = v == null ? 0 : Math.round(100 * v / maxBill);
    const label = v == null ? m.status : ('¥' + v);
    return `<div class="bar-row"><div>${esc(m.month||'—')}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><div class="num">${esc(label)}</div></div>`;
  }).join('');

  const suno = d.suno || {};
  const pipe = (d.pipeline && d.pipeline.stages) || [];
  const bots = d.bots || [];
  const routines = d.routines || [];
  const rules = d.publish_rules || {};
  const goals = rev.goals || {};
  const tasks = d.tasks || {doing:[],todo:[],paused:[],done:[]};

  const catRows = (rev.by_category||[]).map(c =>
    `<tr><td>${esc(c.category)}</td><td class="num">${c.songs}</td><td class="num">¥${c.total_yuan}</td><td class="num">${c.positive_songs}</td></tr>`
  ).join('');

  document.getElementById('app').innerHTML = `
    <section>
      <h2>总览</h2>
      <div class="grid-4">
        <div class="metric"><div class="v">${esc(String(rev.aug_sep_bill_total_yuan ?? '—'))}</div><div class="l">8–9 月账单合计（元）</div></div>
        <div class="metric"><div class="v">${esc(String(rev.positive_share_pct ?? '—'))}%</div><div class="l">有收益曲占比（明细）</div></div>
        <div class="metric"><div class="v">¥${esc(String(rev.positive_mean_yuan ?? '—'))}</div><div class="l">正收益曲均值</div></div>
        <div class="metric"><div class="v">${esc(String(suno.days_left ?? '—'))} 天</div><div class="l">Suno Pro 剩余（至 ${esc(suno.ends_on||'—')}）</div></div>
      </div>
      <div class="note">目标：新歌单曲均值 &gt; ¥${esc(String(goals.new_song_avg_above_yuan??9))}；有收益占比 &gt; ${esc(String(goals.positive_share_above_pct??10))}%（${esc(goals.horizon||'')}）</div>
    </section>

    <section>
      <h2>任务看板</h2>
      <div class="cols">
        ${col('正在做', tasks.doing||[])}
        ${col('待做', tasks.todo||[])}
        ${col('暂缓', tasks.paused||[])}
        ${col('已完成', tasks.done||[])}
      </div>
    </section>

    <section>
      <h2>Bot 团队分工</h2>
      <div class="grid-2">
        ${bots.map(b => `<div class="bot"><div class="n">${esc(b.name)}</div><div class="r">${esc(b.role)}</div><div class="f">${esc(b.focus)}</div></div>`).join('')}
      </div>
    </section>

    <section>
      <h2>歌曲生产流水线（真实计数）</h2>
      <table>
        <thead><tr><th>阶段</th><th class="num">数量</th><th>备注</th></tr></thead>
        <tbody>
          ${pipe.map(s => `<tr><td>${esc(s.name)}</td><td class="num">${s.count}</td><td>${esc(s.note||'')}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="note">发布规则：腾讯 — ${esc(rules.tencent||'未知')}；汽水 — ${esc(rules.qishui||'未知')}；${esc(rules.vocal||'')}</div>
    </section>

    <section>
      <h2>收益基线（聚合）</h2>
      <div class="bar-wrap">${bars}</div>
      <div class="note" style="margin-top:12px">明细曲数 ${esc(String(rev.songs_in_detail??'—'))} · 正收益曲 ${esc(String(rev.positive_earning_songs??'—'))} · 正收益中位数 ¥${esc(String(rev.positive_median_yuan??'—'))} · ${esc(rev.window||'')}</div>
      <table style="margin-top:12px">
        <thead><tr><th>品类</th><th class="num">曲数</th><th class="num">总收益</th><th class="num">正收益曲</th></tr></thead>
        <tbody>${catRows}</tbody>
      </table>
    </section>

    <section>
      <h2>Suno 订阅</h2>
      <div class="grid-2">
        <div class="metric"><div class="v">${esc(suno.plan||'—')}</div><div class="l">档位</div></div>
        <div class="metric"><div class="v">${esc(String(suno.days_left??'—'))}</div><div class="l">距到期天数（${esc(suno.ends_on||'')}）</div></div>
      </div>
      <div class="note">${esc(suno.note||'')}</div>
    </section>

    <section>
      <h2>定时任务</h2>
      <table>
        <thead><tr><th>时间</th><th>内容</th></tr></thead>
        <tbody>${routines.map(r => `<tr><td>${esc(r.when)}</td><td>${esc(r.what)}</td></tr>`).join('')}</tbody>
      </table>
    </section>
  `;
  document.getElementById('foot').textContent = d.disclaimer || '';
}

async function load() {
  try {
    const res = await fetch('data.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    render(d);
  } catch (e) {
    document.getElementById('stamp').innerHTML = '<span class="err">加载失败：' + esc(e.message) + '</span>';
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
